name: daily-digest

on:
  schedule:
    # 07:00 JST（平日）。cron は UTC 指定なので前日 22:00 を書く。
    # 0-4 = 日〜木 UTC → 月〜金 JST。
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "シートに書き込まず HTML だけ作る"
        type: boolean
        default: false
      skip_collect:
        description: "収集をスキップして既存行だけ処理する"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージ
        run: pip install -r requirements.txt

      - name: ダイジェスト生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AINEWS_SA_JSON: ${{ secrets.AINEWS_SA_JSON }}
          AINEWS_OUTPUT_DIR: dist
          TZ: Asia/Tokyo
        run: |
          python -m src.run_daily \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.skip_collect && '--skip-collect' || '' }}

      - name: HTML をアーティファクトに保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: dist/
          retention-days: 30
          if-no-files-found: warn
