name: Backfill Brand Ranking Sheet

# ============================================================
# 一回限りのバックフィル: BigQuery のブランドランキングから
# スプレッドシートに未反映の日付だけを Sheets に追記する。
# BigQuery には書き込まない(参照のみ)ので重複しない。
# 手動実行のみ。
# ============================================================

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'お試し(件数・日付の確認のみ・書き込みなし)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BQ_TABLE: ${{ secrets.BQ_TABLE }}
      BQ_BRAND_TABLE: ${{ secrets.BQ_BRAND_TABLE }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json
      GSHEETS_SPREADSHEET_ID: ${{ secrets.GSHEETS_SPREADSHEET_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write GCP credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > gcp-key.json

      - name: Backfill
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python -m src.backfill_brand_sheets $ARGS

      - name: Cleanup credentials
        if: always()
        run: rm -f gcp-key.json
