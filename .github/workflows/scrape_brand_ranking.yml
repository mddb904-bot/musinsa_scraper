name: Scrape MUSINSA Brand Ranking

# ===========================================
# ブランドランキング(ブランド単位・日次)専用ワークフロー
#   毎日 20:00 JST (= 11:00 UTC) に取得
#
# 既存の商品ランキング(scrape.yml / 週次)とは独立。
# 書き込み先も別: BigQuery brand_ranking テーブル + シート「ブランドランキング」
# ===========================================

on:
  schedule:
    # 毎日 20:00 JST (= 11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'お試し実行（取得のみ・書き込みなし）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_exclusive:
        description: 'MUSINSA独占判定を省略（高速・フラグはNULL）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  scrape-brand-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BQ_TABLE: ${{ secrets.BQ_TABLE }}
      # 省略時は BQ_TABLE のテーブル名を brand_ranking に差し替えて使用。
      # 別データセット等に置きたい場合のみ BQ_BRAND_TABLE を設定。
      BQ_BRAND_TABLE: ${{ secrets.BQ_BRAND_TABLE }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json
      GSHEETS_SPREADSHEET_ID: ${{ secrets.GSHEETS_SPREADSHEET_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Write GCP credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > gcp-key.json

      - name: Run brand-ranking scraper
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.skip_exclusive }}" = "true" ]; then ARGS="$ARGS --skip-exclusive"; fi
          python -m src.run_brand_ranking $ARGS

      - name: Cleanup credentials
        if: always()
        run: rm -f gcp-key.json
